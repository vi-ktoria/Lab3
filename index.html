<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Доска публикаций</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="page-header">
      <h1>Доска публикаций</h1>
      <p class="subtitle">Загружайте публикации и создавайте новые записи.</p>
    </header>

    <section class="panel" aria-labelledby="posts-heading">
      <div class="section-heading">
        <div>
          <h2 id="posts-heading">Публикации</h2>
        </div>
        <button id="load-button" class="button button-primary" type="button">
          Загрузить публикации
        </button>
      </div>
      <div id="posts-list" class="posts-list" aria-live="polite">
        <p class="empty-state">Нажмите «Загрузить публикации», чтобы получить записи.</p>
      </div>
    </section>

    <section class="panel" aria-labelledby="create-heading">
      <h2 id="create-heading">Новая публикация</h2>
      <form id="post-form" novalidate>
        <label for="post-title">Заголовок</label>
        <input id="post-title" name="title" type="text" placeholder="Введите заголовок">
        <label for="post-body">Текст</label>
        <textarea id="post-body" name="body" rows="5" placeholder="Введите текст публикации"></textarea>
        <button id="create-button" class="button button-primary" type="submit">
          Создать публикацию
        </button>
      </form>
    </section>

    <div id="message" class="message" role="status" aria-live="polite"></div>
  </main>
</body>
</html>
